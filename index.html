<body>
<div id="app">
  <button id="muteBtn" title="音のON/OFF" aria-label="音のON/OFF">♪</button>
  <noscript><p style="padding:40px;text-align:center">この試験にはJavaScriptが必要です。</p></noscript>
  <main id="screen"></main>
  <div class="footer">
    ジャズ研検定 — Coda Intelligence Lab<br>
    ※ 娯楽用プログラムです。単位・段位・楽器の上達は保証されません。
  </div>
</div>
<script>
"use strict";
/* ================= 基本ユーティリティ ================= */
const $ = s => document.querySelector(s);
const screenEl = $("#screen");
const rand  = (a,b) => a + Math.random()*(b-a);
const irand = (a,b) => Math.floor(rand(a,b+1));
const pick  = a => a[irand(0,a.length-1)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=irand(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };
const midiHz = m => 440*Math.pow(2,(m-69)/12);
const fmtMs = e => (e>0?"+":"") + Math.round(e) + "ms";
const SITE_URL = "https://jazzcertify.cilabworks.com/";
const AMAZON_ASSOC_TAG = "";
const DONATE_URL = "";
const BOOKS=[
  ["ザ・リアル・ブック（黒本）— セッションの公用語","ザ・リアル・ブック ジャズ"],
  ["ジャズ理論書 — 「なんとなく」を脱する","ジャズ アドリブ 理論 本"],
  ["メトロノーム＆チューナー — 新入生はまずこれ","メトロノーム チューナー"],
  ["イヤホン — 部室の隣室対策にも","イヤホン 音楽 練習"],
];

/* ================= セッション管理（中断処理） ================= */
let S = null; // {aborted}
let gen = 0; // セッション世代
const pendingTimers = new Set();
const pendingRes = new Set();
const removers = [];
let rafId = 0;

function later(fn,ms){ const id=setTimeout(()=>{pendingTimers.delete(id);fn();},ms); pendingTimers.add(id); return id; }
function sleep(ms){ return new Promise(res=>{ const h={res}; pendingRes.add(h);
  const id=setTimeout(()=>{pendingTimers.delete(id);pendingRes.delete(h);res();},ms); pendingTimers.add(id); }); }
// ボタン押下待ちもabortで解放できるようにする
function waitClick(el){ return new Promise(res=>{ const h={res}; pendingRes.add(h); el.addEventListener("click",()=>{pendingRes.delete(h);res();},{once:true}); }); }
function addRemover(fn){ removers.push(fn); }
function on(el,ev,fn,opt){ el.addEventListener(ev,fn,opt); addRemover(()=>el.removeEventListener(ev,fn,opt)); }
function clearAll(){
  pendingTimers.forEach(clearTimeout); pendingTimers.clear();
  pendingRes.forEach(h=>h.res()); pendingRes.clear();
  removers.splice(0).forEach(f=>{try{f()}catch(e){}});
  if(rafId){cancelAnimationFrame(rafId);rafId=0;}
  stopStageAudio();
}
async function until(cond){ const g=gen;
  while(!cond()){ await sleep(30); if(gen!==g || (S&&S.aborted)) return false; } return true; }

/* ================= オーディオ ================= */
let AC=null, master=null, noiseBuf=null, stageBus=null;
let MUTED=false;
try{ MUTED = localStorage.getItem("jazzken_mute")==="1"; }catch(e){}
function applyMute(){
  if(master) master.gain.value = MUTED?0:.85;
  const b=$("#muteBtn"); if(b) b.classList.toggle("muted",MUTED), b.textContent=MUTED?"♪×":"♪";
}
function ensureAudio(){
  if(!AC){
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value=MUTED?0:.85; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function newStageBus(){
  stopStageAudio();
  stageBus = AC.createGain(); stageBus.gain.value=1; stageBus.connect(master);
  return stageBus;
}
function stopStageAudio(){ if(stageBus){ try{stageBus.disconnect();}catch(e){} stageBus=null; } }
function out(){ return stageBus||master; }

function tick(t,{accent=false}={}){
  const ac=ensureAudio();
  const o=ac.createOscillator(), g=ac.createGain();
  o.type="sine"; o.frequency.value = accent?2600:2000;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(accent?.45:.3,t+.003);
  g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  o.connect(g); g.connect(out()); o.start(t); o.stop(t+.08);
}
function chick(t,vel=1){
  const ac=ensureAudio();
  const n=ac.createBufferSource(); n.buffer=noiseBuf;
  const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=8800; f.Q.value=1.2;
  const g=ac.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.6*vel,t+.002);
  g.gain.exponentialRampToValueAtTime(.0001,t+.06);
  n.connect(f); f.connect(g); g.connect(out()); n.start(t); n.stop(t+.09);
}
function ride(t,vel=1){
  const ac=ensureAudio();
  const n=ac.createBufferSource(); n.buffer=noiseBuf;
  const f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.value=7300; f.Q.value=1.1;
  const g=ac.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.3*vel,t+.004);
  g.gain.exponentialRampToValueAtTime(.0001,t+.38);
  n.connect(f); f.connect(g); g.connect(out()); n.start(t); n.stop(t+.45);
  [8700,10900,13200].forEach((fr,i)=>{
    const o=ac.createOscillator(), og=ac.createGain();
    o.type="sine"; o.frequency.value=fr;
    og.gain.setValueAtTime(.0001,t);
    og.gain.exponentialRampToValueAtTime(.1*vel/(i+1),t+.003);
    og.gain.exponentialRampToValueAtTime(.0001,t+.32+i*.06);
    o.connect(og); og.connect(out()); o.start(t); o.stop(t+.45);
  });
}
function bass(t,midi,dur=.5){
  const ac=ensureAudio();
  const f0=midiHz(midi);
  const o=ac.createOscillator(); o.type="triangle"; o.frequency.value=f0;
  const o2=ac.createOscillator(); o2.type="sine"; o2.frequency.value=f0;
  const fl=ac.createBiquadFilter(); fl.type="lowpass"; fl.frequency.value=550;
  const g=ac.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.5,t+.025);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(fl); o2.connect(fl); fl.connect(g); g.connect(out());
  o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05);
}
function chordSnd(t,midis,dur=1.6){
  const ac=ensureAudio();
  midis.forEach((m,i)=>{
    const st=t+i*.008;
    const o=ac.createOscillator(); o.type="triangle";
    o.frequency.value=midiHz(m)*(1+(Math.random()-.5)*.003);
    const f=ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value=2600;
    const g=ac.createGain();
    g.gain.setValueAtTime(.0001,st);
    g.gain.exponentialRampToValueAtTime(.15,st+.012);
    g.gain.exponentialRampToValueAtTime(.0001,st+dur);
    o.connect(f); f.connect(g); g.connect(out()); o.start(st); o.stop(st+dur+.05);
  });
}
function sfxOK(){ const t=AC.currentTime+.02; [64,67,71,76].forEach((m,i)=>chordSnd(t+i*.05,[m],.3)); }
function sfxNG(){ const ac=ensureAudio(); const t=ac.currentTime+.02;
  [110,117].forEach(fr=>{ const o=ac.createOscillator(),g=ac.createGain();
    o.type="sawtooth"; o.frequency.value=fr;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.connect(g); g.connect(out()); o.start(t); o.stop(t+.35); });
}
function uiAt(ctxT,fn){ later(fn, Math.max(0,(ctxT-AC.currentTime)*1000)); }
// タッチ→イベント発火の遅延（iOS/Androidで30〜60ms程度）を補正
const IS_TOUCH = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
const TAP_OFFSET_S = (IS_TOUCH ? -35 : -12)/1000;
function tapCtx(e){
  const now=performance.now();
  let t = e && typeof e.timeStamp==="number" ? e.timeStamp : now;
  if(t>now+1 || now-t>2000) t=now;
  return AC.currentTime + (t-now)/1000 + TAP_OFFSET_S;
}
// タップした感触のための効果音（判定音とは別系）
function tapFx(){
  if(!AC) return;
  const t=AC.currentTime+.001;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type="sine"; o.frequency.value=3100;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.3,t+.002);
  g.gain.exponentialRampToValueAtTime(.0001,t+.035);
  o.connect(g); g.connect(out()); o.start(t); o.stop(t+.05);
}

/* ================= 画面遷移 ================= */
function show(html){ screenEl.innerHTML = html; window.scrollTo(0,0); }
function newSession(){ if(S) S.aborted=true; clearAll(); gen++; S={aborted:false}; return S; }
function stageFrame(kicker,name,inner){
  show(`<div class="stage">
    <div class="kicker">${kicker}</div>
    <h2 class="serif glow">${name}</h2>
    <div id="stageBody">${inner}</div>
    <div class="center"><button class="linkbtn" id="quitBtn">試験を中断してタイトルに戻る</button></div>
  </div>`);
  const quitFn=e=>{ e.preventDefault(); e.stopPropagation(); if(S.aborted)return; S.aborted=true; clearAll(); title(); };
  $("#quitBtn").addEventListener("click", quitFn);
  $("#quitBtn").addEventListener("pointerdown", quitFn);
  return $("#stageBody");
}
function judgeWord(absE){
  if(absE<=15)  return ["神","err-ok"];
  if(absE<=30)  return ["プロ級","err-ok"];
  if(absE<=60)  return ["セッション適性あり","err-mid"];
  if(absE<=100) return ["ギリ許容","err-mid"];
  if(absE<=160) return ["ベースが睨んでいる","err-bad"];
  return ["原因はあなた","err-bad"];
}
function errScore(e){ return Math.max(0, 100 - Math.abs(e)*0.62); }

/* ================= 科目1：カウントオフ ================= */
async function stage1(S){
  const body = stageFrame("SHITSUMON 1 / 5","第一科目：カウントオフ",
   `<p class="desc">クリックが <b>8回</b> 鳴ったあと、4拍だけ消えます。<br>
    沈黙を数えて、次の「1」をタップしてください。<b>全5ラウンド</b>・BPMは毎回変わります。</p>
    <div class="kokoro">奏者心得：世界は常にあなたより一拍遅れている。</div>
    <div class="dots" id="dots"></div>
    <div class="bigstat" id="stat"></div>
    <div class="substat" id="sub"></div>
    <div class="pad" id="pad">タップで開始</div>
    <div class="mini" id="rinfo"></div>
    <p class="note">画面タップまたはスペースキー（※端末の入力遅延は約${IS_TOUCH?35:12}ms補正済み。残りは実力）</p>`);
  const dots = $("#dots"), stat=$("#stat"), sub=$("#sub"), pad=$("#pad"), rinfo=$("#rinfo");
  for(let i=0;i<8;i++){ const d=document.createElement("i"); if(i%4===0)d.classList.add("acc"); dots.appendChild(d); }
  const dotEls=[...dots.children];
  let armed=false, tapT=null;
  const onTap = e => { if(armed && tapT===null) tapT = tapCtx(e); };
  on(pad,"pointerdown",onTap);
  const keyFn = e => { if(e.code==="Space"){e.preventDefault();onTap(e);} };
  on(window,"keydown",keyFn);

  // 開始待ち
  let started=false;
  on(pad,"pointerdown",()=>{ if(!started){started=true;} });
  stat.textContent="準備はいい？";
  await until(()=>started); if(S.aborted) return;
  pad.textContent="待機中…";

  newStageBus();
  const errs=[];
  for(let r=0;r<5;r++){
    if(S.aborted) return;
    const bpm=irand(92,160), beat=60/bpm;
    rinfo.textContent=`ラウンド ${r+1}/5　♩=${bpm}`;
    stat.textContent="クリックを聴け"; stat.className="bigstat";
    sub.textContent="";
    dotEls.forEach(d=>d.classList.remove("on"));
    pad.className="pad"; pad.textContent="待機中…";
    armed=false; tapT=null;
    const t0=AC.currentTime+0.9;
    for(let i=0;i<8;i++){ const tt=t0+i*beat; tick(tt,{accent:i%4===0}); uiAt(tt,()=>dotEls[i].classList.add("on")); }
    const expected=t0+12*beat; // 8拍鳴る + 4拍休み → 13拍目が「1」
    uiAt(t0+8*beat,()=>{ stat.textContent="　"; sub.textContent="（沈黙を数えろ）"; pad.classList.add("armed"); pad.textContent="タップ！"; armed=true; });
    await until(()=> tapT!==null || AC.currentTime > expected + 1.4*beat);
    if(S.aborted) return;
    armed=false; pad.classList.remove("armed"); pad.classList.add("done"); pad.textContent="終了";
    if(tapT===null){
      errs.push(null);
      stat.textContent="空振り"; stat.className="bigstat err-bad";
      sub.textContent="「1」は永遠に来た";
      sfxNG();
    }else{
      const e=(tapT-expected)*1000; errs.push(e);
      const [w,c]=judgeWord(Math.abs(e));
      stat.innerHTML=`<span class="${c}">${fmtMs(e)}</span>`;
      sub.innerHTML=`${w}　／　${e<-5?"走り（早い）":e>5?"タメ（遅い）":"ジャスト"}`;
      Math.abs(e)<=60 ? sfxOK() : sfxNG();
    }
    await sleep(1400);
  }
  if(S.aborted) return;
  const scored=errs.filter(e=>e!==null);
  const avg = errs.reduce((s,e)=>s+(e===null?0:errScore(e)),0)/5;
  const signed = scored.length? scored.reduce((a,b)=>a+b,0)/scored.length : 0;
  const avgAbs = scored.length? scored.reduce((a,b)=>a+Math.abs(b),0)/scored.length : 999;
  let comment;
  if(avgAbs<=30) comment="縦が異常にピシッとしている。もう人間メトロノームとして働け。";
  else if(avgAbs<=60) comment="合格。セッションで責められることはまずない。";
  else if(avgAbs<=100) comment="許容範囲。だがベースの目は時々厳しい。";
  else comment= signed<0 ? "走り癖あり。次からカウントの前に深呼吸。" : "タメ癖あり。ジャズというより演歌の間。";
  return {score:Math.round(avg), detail:`平均ズレ ${Math.round(avgAbs)}ms（${signed<-8?"走り気味":signed>8?"タメ気味":"真っ直ぐ"}）`, comment};
}

/* ================= 科目2：2&4ハイハット ================= */
async function stage2(S){
  const body = stageFrame("SHITSUMON 2 / 5","第二科目：2&4ハイハット",
   `<p class="desc">ライドシンバルが鳴り続けます。<b>2拍と4拍だけ</b>をタップし続けてください（4小節＝8回）。<br>
    最初の2小節はお手本のハイハットが鳴ります。</p>
    <div class="kokoro">奏者心得：スイングは右手ではなく左足で決まる。</div>
    <div class="hud"><span>小節</span><b id="barNo">–</b><span>判定</span><b id="hitCt">0/8</b></div>
    <div class="lane" style="display:flex;align-items:center;justify-content:center"><div class="bigstat" id="live" style="margin:0;font-size:17px;line-height:1.9"></div></div>
    <div class="pad" id="pad">タップで開始</div>
    <p class="note">チッ、チッと鳴るタイミングをそのまま引き継げ</p>`);
  const pad=$("#pad"), live=$("#live"), barNo=$("#barNo"), hitCt=$("#hitCt");
  let started=false;
  on(pad,"pointerdown",()=>{started=true;});
  await until(()=>started); if(S.aborted) return;
  pad.textContent="待機中…";

  newStageBus();
  const bpm=132, beat=60/bpm, bars=6;
  const t0=AC.currentTime+1.0;
  const expected=[];
  for(let b=0;b<bars;b++){
    const bt=t0+b*4*beat;
    // ライドパターン（spang-a-lang）: 1, 2, a-of-2, 3, 4, a-of-4
    [0,1,1+2/3,2,3,3+2/3].forEach((off,i)=> ride(bt+off*beat, (off===1||off===3)?.8:.6));
    // ウォーキングベース風の土台
    const roots=[41,46,41,48,46,41];
    bass(bt,roots[b],beat*1.8);
    uiAt(bt,()=>{ barNo.textContent=`${b+1}/6`; });
    if(b<2){ chick(bt+1*beat); chick(bt+3*beat); }
    else   { expected.push(bt+1*beat, bt+3*beat); }
  }
  uiAt(t0+2*4*beat,()=>{ pad.classList.add("armed"); pad.textContent="2 と 4 を踏め"; live.innerHTML+="あなたの番<br>"; });
  uiAt(t0,()=>{ live.innerHTML="お手本：チッ　チッ<br>"; });

  const win=beat*0.45;
  const judged=new Array(expected.length).fill(null);
  expected.forEach((et,i)=>uiAt(et+win,()=>{ if(judged[i]===null){ judged[i]="miss"; live.innerHTML+='<span class="err-bad">miss</span> '; } }));
  let armed=false, nHits=0;
  later(()=>{armed=true;}, (t0+2*4*beat-AC.currentTime)*1000);
  const onTap=e=>{
    if(!armed) return;
    chick(AC.currentTime+.001); // 踏んだ感触（ハイハット音）
    const tc=tapCtx(e);
    let bi=-1,bd=1e9;
    expected.forEach((et,i)=>{ if(judged[i]===null){ const d=Math.abs(tc-et); if(d<bd){bd=d;bi=i;} } });
    if(bi>=0 && bd<=win){
      const e=(tc-expected[bi])*1000; judged[bi]=e; nHits++;
      hitCt.textContent=`${nHits}/8`;
      const [w,c]=judgeWord(Math.abs(e));
      live.innerHTML+=`<span class="${c}">${fmtMs(e)}</span> `;
    }
  };
  on(pad,"pointerdown",onTap);
  const keyFn=e=>{ if(e.code==="Space"){e.preventDefault();onTap(e);} };
  on(window,"keydown",keyFn);

  const end=t0+bars*4*beat;
  await until(()=> AC.currentTime>end);
  if(S.aborted) return;

  let total=0, errs=[];
  judged.forEach(j=>{ if(typeof j==="number"){ total+=errScore(j); errs.push(j); } });
  const score=Math.round(total/expected.length);
  const signed=errs.length?errs.reduce((a,b)=>a+b,0)/errs.length:0;
  let comment;
  if(score>=90) comment="左足に神が宿っている。ドラム科へ編入してもいい。";
  else if(score>=70) comment="2&4は踏める。あとはそれを30分保つだけ。";
  else if(score>=45) comment="踏めてはいる。だが時々『3』に出かけている。";
  else comment="ハイハットが迷子。まずメトロノームを2&4にして練習しよう。";
  return {score, detail:`命中 ${nHits}/8（${signed<-5?"走り気味":signed>5?"タメ気味":"概ね正中"}）`, comment};
}

/* ================= 科目3：耳コーデ ================= */
const NOTE_NAMES=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
const CHORDS=[
  {id:"maj7", label:"△7",    iv:[0,4,11,14], ns:"1・3・7・9"},
  {id:"m7",   label:"m7",    iv:[0,3,10,14], ns:"1・♭3・♭7・9"},
  {id:"7",    label:"7",     iv:[0,4,10,17], ns:"1・3・♭7・13"},
  {id:"m7b5", label:"m7(♭5)",iv:[0,3,6,10],  ns:"1・♭3・♭5・♭7"},
  {id:"dim7", label:"dim7",  iv:[0,3,6,9],   ns:"1・♭3・♭5・♭♭7"},
  {id:"mmaj7",label:"m△7",   iv:[0,3,11,14], ns:"1・♭3・7・9"},
  {id:"sus",  label:"7sus4", iv:[0,5,10,14], ns:"1・4・♭7・9"},
];
async function stage3(S){
  const body = stageFrame("SHITSUMON 3 / 5","第三科目：耳コーデ",
   `<p class="desc">コードが鳴ります。種類を4択で当ててください（全8問）。<br>
    △、♭5、m△7……ぜんぶ読めますよね。</p>
    <div class="kokoro">奏者心得：m7(♭5)を「変なm7」と呼ぶのは今日で卒業。</div>
    <div class="hud"><span>問題</span><b id="qno">–</b><span>正解</span><b id="okCt">0</b></div>
    <div class="bigstat" id="qStat" style="font-size:20px"></div>
    <button class="btn" id="replay">▶ もう一度鳴らす</button>
    <div class="opts" id="opts"></div>
    <div class="explain" id="exp" style="display:none"></div>
    <button class="btn primary" id="nextBtn" style="display:none">次へ</button>`);
  newStageBus();
  const qno=$("#qno"), okCt=$("#okCt"), qStat=$("#qStat"), opts=$("#opts"),
        exp=$("#exp"), nextBtn=$("#nextBtn"), replay=$("#replay");
  let nOk=0;

  const order=shuffle(["maj7","m7","7","m7b5","dim7","mmaj7"].map(id=>CHORDS.find(c=>c.id===id))
                      .concat([pick(CHORDS),pick(CHORDS)]));
  for(let q=0;q<8;q++){
    if(S.aborted) return;
    const chord=order[q];
    const root=irand(46,57);
    const midis=[root-12,...chord.iv.map(i=>root+i)];
    const others=shuffle(CHORDS.filter(c=>c.id!==chord.id)).slice(0,3);
    const buttons=shuffle([chord,...others]);

    qno.textContent=`${q+1}/8`;
    qStat.textContent="聴け";
    exp.style.display="none"; nextBtn.style.display="none"; opts.innerHTML="";
    const play=()=>chordSnd(AC.currentTime+.08,midis,1.8);
    play();
    replay.onclick=play;
    let answered=false;
    buttons.forEach(b=>{
      const btn=document.createElement("button");
      btn.className="btn"; btn.innerHTML=`<span style="color:var(--dim);font-size:11px;margin-right:8px">${buttons.indexOf(b)+1}</span>${b.label}`;
      btn.onclick=()=>judge(b,btn);
      opts.appendChild(btn);
    });
    const keyHandler=e=>{
      const n={"Digit1":0,"Digit2":1,"Digit3":2,"Digit4":3}[e.code];
      if(n!==undefined && !answered){ const b=opts.children[n]; if(b) b.click(); }
    };
    on(window,"keydown",keyHandler);

    function judge(b,btn){
      if(answered) return; answered=true;
      [...opts.children].forEach(x=>x.disabled=true);
      const rootName=NOTE_NAMES[root%12];
      if(b.id===chord.id){ btn.classList.add("correct"); nOk++; okCt.textContent=nOk; sfxOK();
        qStat.innerHTML=`<span class="err-ok">正解</span>　<b>${rootName}${chord.label}</b>`;
      }else{
        btn.classList.add("wrong");
        [...opts.children].forEach((x,i)=>{ if(buttons[i].id===chord.id)x.classList.add("correct"); });
        sfxNG();
        qStat.innerHTML=`<span class="err-bad">不正解</span>　答えは <b>${rootName}${chord.label}</b>`;
      }
      exp.style.display="block";
      exp.innerHTML=`<b>${rootName}${chord.label}</b>　構成音 ${[0,...chord.iv].map(s=>NOTE_NAMES[(root+s)%12]).join("・")}`;
      nextBtn.style.display="block";
    }
    await waitClick(nextBtn);
    if(S.aborted) return;
  }
  const score=Math.round(nOk/8*100);
  let comment;
  if(nOk===8)   comment="完璧。譜面なしで曲に入れる。つまりセッションで生きられる。";
  else if(nOk>=6) comment="良い耳。あとはdim7とm△7を聞き分けるだけ。";
  else if(nOk>=4) comment="△とmの区別はつく。♭5が来ると気配が消える。";
  else comment="全部△7に聴こえる病。まず自分で鍵盤を押さえて鳴らしてみよう。";
  return {score, detail:`${nOk}/8 正解`, comment};
}

async function stage5(S){
  const body = stageFrame("SHITSUMON 5 / 5","最終科目：ジャイアント・ステップス",
   `<p class="desc">画面右から<b>コルトレーン・チェンジ</b>が迫ります。<br>
    コードがラインに重なった瞬間にタップ（またはスペース）。<b>外したら即・振り落とし。</b>テンポは上がり続けます。</p>
    <div class="hud"><span>テンポ</span><b id="gsBpm">–</b><span>コーラス</span><b id="gsCh">–</b><span>倒した</span><b id="gsHit">0</b></div>
    <div class="lane" id="lane"><div class="hitline"></div></div>
    <div class="pad" id="pad">タップで開始</div>
    <div class="mini" id="gsInfo">奏者心得：これは楽曲ではなく検死報告である。</div>`);
  const lane=$("#lane"), pad=$("#pad"), gsBpm=$("#gsBpm"), gsCh=$("#gsCh"), gsHit=$("#gsHit"), gsInfo=$("#gsInfo");
  let started=false;
  on(pad,"pointerdown",()=>{started=true;});
  await until(()=>started); if(S.aborted) return;
  pad.textContent="カウントイン…";

  newStageBus();
  const beat0=60/100;
  const t0=AC.currentTime+1.0;
  // カウントイン2小節
  for(let i=0;i<8;i++) tick(t0+i*beat0,{accent:i%4===0});
  const tStart=t0+8*beat0;
  uiAt(tStart,()=>{ pad.classList.add("armed"); pad.textContent="タップ！"; });

  // イベント列の生成（16コード=1コーラス、毎コーラス+20bpm、10コーラスで人間卒業）
  const events=[]; let t=tStart, bpm=100;
  for(let ch=0; ch<10; ch++){
    const beat=60/bpm;
    for(let i=0;i<16;i++){
      const [label,semi]=GS_PROG[i];
      const ctxT=t+i*beat;
      events.push({ctxT, label, midi:36+semi, bpm, chorus:ch+1, beat, judged:false, el:null});
      ride(ctxT,.8);
      bass(ctxT,36+semi,Math.min(.45,beat*.85));
    }
    t += 16*beat; bpm += 20;
  }
  const endT=t;

  const lineX=73, pxPerSec=380, laneW=()=>lane.clientWidth;
  let hits=0, dead=false, finished=false, doFinish=null;

  function judgeTap(e){
    if(dead||finished) return;
    const tc=tapCtx(e);
    if(tc < tStart - 0.15) return; // カウントイン中は無視
    let bi=null,bd=1e9;
    for(const ev of events){
      if(ev.judged) continue;
      const d=Math.abs(tc-ev.ctxT);
      if(d<bd){bd=d;bi=ev;}
      if(ev.ctxT-tc>0.5) break;
    }
    if(bi && bd<=bi.beat*0.38){
      bi.judged=true; hits++; gsHit.textContent=hits;
      if(bi.el){bi.el.classList.add("hit"); setTimeout(()=>{bi.el&&bi.el.remove()},220);}
    }else if(bi){
      // コードが重なっていないのに押した → 即・振り落とし
      dead=true; bi.judged=true;
      if(bi.el) bi.el.classList.add("miss");
      doFinish&&doFinish(false,bi,"空振り");
    }
  }
  on(pad,"pointerdown",judgeTap);
  const keyFn=e=>{ if(e.code==="Space"){e.preventDefault();judgeTap(e);} };
  on(window,"keydown",keyFn);

  const result = await new Promise(res=>{
    doFinish=(cleared,ev,cause)=>{
      finished=true;
      cancelAnimationFrame(rafId); rafId=0;
      res({cleared,ev,cause});
    };
    const frame=()=>{
      rafId=requestAnimationFrame(frame);
      const now=AC.currentTime;
      // チップ生成・移動
      for(const ev of events){
        const x=lineX+(ev.ctxT-now)*pxPerSec;
        if(!ev.el && x<laneW()+160 && x>-200){
          const el=document.createElement("div");
          el.className="gchord"; el.textContent=ev.label;
          lane.appendChild(el); ev.el=el;
        }
        if(ev.el) ev.el.style.left=x+"px";
      }
      // HUD
      const nxt=events.find(e=>e.ctxT>=now-0.3);
      if(nxt){ gsBpm.textContent="♩="+nxt.bpm; gsCh.textContent=nxt.chorus+"/10"; }
      // ミス検出
      for(const ev of events){
        if(ev.ctxT-now>0.1) break;
        if(!ev.judged && !dead && now>ev.ctxT+ev.beat*0.38){
          dead=true;
          ev.judged=true;
          if(ev.el){ev.el.classList.add("miss");}
          doFinish(false,ev,"取り逃し");
          return;
        }
      }
      if(now>endT+0.6 && !finished){ finished=true; doFinish(true,null); return; }
    };
    frame();
  });
  if(S.aborted) return;
  stopStageAudio();
  const cleared=result.cleared, ev=result.ev;
  const deadBpm = ev? ev.bpm : bpm-20;
  let verdict;
  if(cleared) verdict="全コーラス制覇。あなたはコルトレーンです。";
  else if(result.cause==="空振り") verdict="空振りで落下。連打は通用しない。";
  else if(deadBpm<130) verdict="序の口。ちなみに原曲は♩=272です。";
  else if(deadBpm<190) verdict="中級者。部室では語れるレベル。";
  else if(deadBpm<250) verdict="強い。だがコルトレーンはもっと上。";
  else if(deadBpm<300) verdict="もはや奏者。あと一歩で人間卒業。";
  else verdict="お前はもうコルトレーン。";
  cleared?sfxOK():sfxNG();
  const score=Math.min(100,Math.round(hits*1.1));
  const detail=cleared ? `${hits}チェンジ撃破（♩=${deadBpm}・全10コーラス）`
    : `${hits}チェンジ撃破（♩=${deadBpm}・コーラス${ev?ev.chorus:10}で${result.cause}）`;
  return {score, detail, comment: cleared?"人間卒業。もはや採点する資格がありません。":verdict};
}

function demoCountoff(el){
  el.innerHTML=`<div class="demo"><div class="cap">PREVIEW</div>
    <div class="dots" id="dd"></div>
    <div class="mini" id="dcap"></div></div>`;
  const dd=el.querySelector("#dd"), cap=el.querySelector("#dcap");
  for(let i=0;i<13;i++){const d=document.createElement("i"); if(i%4===0)d.classList.add("acc"); dd.appendChild(d);}
  const dots=[...dd.children];
  const beat=.48; let step=0;
  const iv=setInterval(()=>{
    if(step<8){ dots[step].classList.add("on");
      cap.textContent="クリックが8回鳴る…"; }
    else if(step<12){ dots.forEach(d=>d.classList.remove("on"));
      cap.textContent="…4拍、沈黙（心の中で数えろ）"; }
    else if(step===12){ dots.forEach(d=>d.classList.remove("on")); dots[12].classList.add("on");
      cap.innerHTML="<b style='color:var(--gold)'>ここでタップ！</b>"; }
    else{ dots.forEach(d=>d.classList.remove("on")); cap.textContent=""; }
    step=(step+1)%15;
  },beat*1000);
  return ()=>clearInterval(iv);
}
function demo24(el){
  el.innerHTML=`<div class="demo"><div class="cap">PREVIEW</div>
    <div class="beatrow" id="bb"><div class="b">1</div><div class="b">2</div><div class="b">3</div><div class="b">4</div></div>
    <div class="mini">水色が鳴る＝<b style="color:var(--acc)">2と4</b>だけを踏む</div></div>`;
  const bs=[...el.querySelectorAll("#bb .b")];
  const beat=.55; let step=0;
  const iv=setInterval(()=>{
    bs.forEach(b=>b.classList.remove("on","hat"));
    bs[step].classList.add("on");
    if(step===1||step===3){ bs[step].classList.add("hat"); chick(AC.currentTime+.01); }
    else ride(AC.currentTime+.01,.55);
    step=(step+1)%4;
  },beat*1000);
  return ()=>clearInterval(iv);
}

function rankOf(avg){
  if(avg>=90) return ["SS","ジョン・コルトレーン","非人間領域。もはやこの検定の対象外。"];
  if(avg>=80) return ["S","ビル・エバンス","繊細かつ精密。部室のピアノの前でため息が出る。"];
  if(avg>=70) return ["A","町のジャズ喫茶の顔","常連として名前を覚えられるレベル。"];
  if(avg>=55) return ["B","セッション常連","どの曲にもだいたい入っていける。"];
  if(avg>=40) return ["C","ジャズ研1年（新歓デビュー）","可能性の塊。まず楽譜アプリを入れよう。"];
  if(avg>=25) return ["D","Fのブルースで迷子","迷子になっても吹き続ければいつか戻れる。"];
  return ["F","カウントオフで脱落","伝説の開始。ここから全ては始まる。"];
}
function certNo(avg,results){
  const s=avg+"|"+results.map(r=>r.score).join(",")+"|"+Date.now();
  let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0;
  return "JAZZ-"+h.toString(36).toUpperCase().padStart(5,"0").slice(-5);
}
function loadBest(){ try{return JSON.parse(localStorage.getItem("jazzken_best")||"null")}catch(e){return null} }
function saveBest(avg,rank){
  const b=loadBest();
  if(!b||avg>b.avg){ localStorage.setItem("jazzken_best",JSON.stringify({avg,rank,date:Date.now()})); return true }
  return false;
}
function loadHist(){ try{return JSON.parse(localStorage.getItem("jazzken_hist")||"[]")}catch(e){return[]} }
function saveHist(h){ try{localStorage.setItem("jazzken_hist",JSON.stringify(h.slice(0,50)))}catch(e){} }

function makeShareImage(results,avg,rank,rname,cert){
  const c=document.createElement("canvas"); c.width=1080; c.height=1920;
  const x=c.getContext("2d");
  const grad=x.createRadialGradient(540,300,80,540,960,1400);
  grad.addColorStop(0,"#1b1726"); grad.addColorStop(1,"#0b0b10");
  x.fillStyle=grad; x.fillRect(0,0,1080,1920);
  x.textAlign="center";
  x.fillStyle="#8f8a7d"; x.font="28px sans-serif"; x.fillText("U N O F F I C I A L   C E R T I F I C A T I O N",540,160);
  x.fillStyle="#e8b33c"; x.font="700 88px Georgia,serif"; x.fillText("ジャズ研検定",540,270);
  x.strokeStyle="#e8b33c"; x.lineWidth=10;
  x.beginPath(); x.arc(540,700,230,0,Math.PI*2); x.stroke();
  x.fillStyle="#e8b33c"; x.font="800 260px Georgia,serif"; x.fillText(rank,540,800);
  x.fillStyle="#efe9dc"; x.font="700 62px sans-serif"; x.fillText(rname,540,1030);
  x.fillStyle="#8f8a7d"; x.font="36px sans-serif"; x.fillText(`総合 ${avg}点 / 100`,540,1090);
  x.fillStyle="#8f8a7d"; x.font="26px sans-serif"; x.fillText("認定番号 "+cert,540,1155);
  results.forEach((r,i)=>{
    const y=1240+i*110;
    x.textAlign="right"; x.fillStyle="#8f8a7d"; x.font="30px sans-serif";
    x.fillText(STAGES[i].name,470,y);
    const rr=(X,Y,W,H,R)=>{ if(x.roundRect){x.beginPath();x.roundRect(X,Y,W,H,R);} else {x.beginPath();x.rect(X,Y,W,H);} x.fill(); };
    x.fillStyle="#2b2b38"; rr(500,y-24,380,32,16);
    x.fillStyle="#e8b33c"; rr(500,y-24,380*r.score/100,32,16);
    x.textAlign="left"; x.fillStyle="#efe9dc"; x.font="700 32px sans-serif"; x.fillText(r.score,905,y);
  });
  x.textAlign="center"; x.fillStyle="#57534a"; x.font="28px sans-serif";
  x.fillText("Coda Intelligence Lab — #ジャズ研検定",540,1800);
  x.fillStyle="#e8b33c"; x.font="700 34px sans-serif";
  x.fillText("jazzcertify.cilabworks.com",540,1858);
  return c;
}

    "鳴ったコードを聴き分ける実技試験です。<br>実技が無理なら気合い。気合いが無理ならコーヒーを飲んで待て。",
    "知識科目。ジャズ研の空気を正しく読めますか。",
    "最終実技。追いつくのはコードか、あなたか。",
  ];
  const demos=[demoCountoff,demo24,null,null,null];
  for(let i=0;i<STAGES.length;i++){
    if(s.aborted) return;
    await introScreen(`SHITSUMON ${i+1} / 5`,STAGES[i].name,intros[i],demos[i]);

  </div>`);
  [...document.querySelectorAll(".stagelist .btn")].forEach(b=>b.onclick=()=>practice(STAGES[+b.dataset.i]));
  $("#back").onclick=()=>title();
}
const RADAR_LABEL=["カウントオフ","2&4ハット","耳コーデ","常識","G.ステップス"];
function drawRadar(c,scores,best){
  const N=5,dpr=window.devicePixelRatio||1,W=340,H=330;
  c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  const cx=W/2,cy=H/2+6,R=108;
  const ang=i=>-Math.PI/2+i*2*Math.PI/N;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/100,cy+Math.sin(ang(i))*R*v/100];
  for(let r=1;r<=4;r++){ x.beginPath();
    for(let i=0;i<=N;i++){const[px,py]=pt(i%N,r*25); i?x.lineTo(px,py):x.moveTo(px,py);}
    x.strokeStyle=r===4?"#2b2b38":"rgba(43,43,56,.55)"; x.lineWidth=1; x.stroke(); }
  for(let i=0;i<N;i++){ x.beginPath(); x.moveTo(cx,cy); const[px,py]=pt(i,100); x.lineTo(px,py); x.strokeStyle="rgba(43,43,56,.55)"; x.stroke(); }
  x.font="11px sans-serif"; x.fillStyle="#8f8a7d"; x.textAlign="center"; x.textBaseline="middle";
  for(let i=0;i<N;i++){ const[px,py]=pt(i,126); x.fillText(RADAR_LABEL[i],px,py); }
  const poly=(vals,stroke,fill)=>{ x.beginPath();
    vals.forEach((v,i)=>{const[px,py]=pt(i,v); i?x.lineTo(px,py):x.moveTo(px,py);});
    x.closePath(); x.fillStyle=fill; x.fill(); x.strokeStyle=stroke; x.lineWidth=2; x.stroke(); };
  poly(best,"#7ec8e3","rgba(126,200,227,.10)");
  poly(scores,"#e8b33c","rgba(232,179,60,.18)");
  scores.forEach((v,i)=>{ const[px,py]=pt(i,v); x.beginPath(); x.arc(px,py,3,0,7); x.fillStyle="#e8b33c"; x.fill(); });
}
function historyScreen(){
  newSession();
  const hist=loadHist();
  const best=[0,0,0,0,0]; hist.forEach(h=>h.scores.forEach((s,i)=>{ if(s>best[i])best[i]=s; }));
  const rows=hist.slice(0,12).map((h,i)=>{
    const d=new Date(h.d);
    const ds=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    return `<button class="btn histrow${i===0?" sel":""}" data-i="${i}"><span>${ds}</span><span><b style="color:var(--gold)">${h.rank}</b>　${h.avg}点</span></button>`;
  }).join("");
  show(`<div>
    <div class="kicker" style="margin-top:10px">RECORD</div>
    <h2 class="serif glow">受験履歴</h2>
    ${hist.length?`
      <div class="card" style="padding:14px 8px"><canvas id="radar" style="display:block;margin:0 auto;max-width:340px;width:100%"></canvas>
        <div class="mini" style="margin-top:8px"><span style="color:var(--gold)">■</span> 選択した回　<span style="color:var(--acc)">■</span> 科目別ベスト</div></div>
      <div class="stagelist" style="margin-top:14px">${rows}</div>`
      :`<p class="desc center" style="margin:30px 0">まだ受験記録がありません。<br>検定を受けると結果とレーダーチャートがここに記録されます。</p>`}
    <button class="btn ghost" id="back" style="margin-top:18px">タイトルへ</button>
  </div>`);
  $("#back").onclick=()=>title();
  if(!hist.length) return;
  const cv=$("#radar");
  const draw=i=>drawRadar(cv,hist[i].scores,best);
  draw(0);
  document.querySelectorAll(".histrow").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".histrow").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); draw(+b.dataset.i);
  });
}
function title(){
  newSession();
  const best=loadBest();
  show(`<div class="center">
    <div class="kicker" style="margin-top:36px">UNOFFICIAL CERTIFICATION</div>
    <h1 class="serif glow">ジャズ研検定</h1>
    <div class="dim">Coda Intelligence Lab・非公式認定試験</div>
    <div class="hr" style="max-width:340px;margin:20px auto"></div>
    <p class="desc" style="max-width:400px;margin:0 auto">5科目の試験で、あなたの「ジャズ度」を採点します。<br>
    音が出ます。イヤホン推奨。<br>${best?`現在の最高段位：<b style="color:var(--gold)">${best.rank}</b>（${best.avg}点）`:"まだ受験記録がありません。"}</p>
    <div style="max-width:320px;margin:26px auto 0">
      <button class="btn primary" id="start">検定を受ける</button>
      <button class="btn" id="practice">科目別練習</button>
      <button class="btn" id="histBtn">受験履歴</button>
    </div>
  </div>`);
  $("#start").onclick=()=>{ ensureAudio(); exam(); };
  $("#practice").onclick=()=>{ ensureAudio(); practiceMenu(); };
  $("#histBtn").onclick=()=>historyScreen();
}

applyMute();
title();
</script>
